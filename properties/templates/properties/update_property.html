{% load static %}
{% load bootstrap5 %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'properties/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'properties/scss/add_property.scss' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>Редактировать ваше объявление</title>
</head>

<body>
    {% include 'properties/elements/header.html' %}

    <div class="container">
        <h2>Редактировать ваше объявление</h2>

        <form id="propertyForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <i class="fas fa-heading form-icon"></i>
                <input type="text" id="id_title" name="title" value="{{ property.title }}" placeholder=" " required>
                <label for="id_title" class="label-placeholder">Заголовок</label>
            </div>

            <div class="form-group">
                <i class="fas fa-align-left form-icon-des"></i>
                <textarea id="id_description" name="description" rows="4" placeholder="">{{ property.description }}</textarea>
                <label for="id_description" class="label-placeholder">Описание</label>
            </div>

            <div class="form-group">
                <i class="fas fa-dollar-sign form-icon"></i>
                <input type="number" id="id_price" name="price" value="{{ property.price }}" step="1" placeholder=" ">
                <label for="id_price" class="label-placeholder">Цена</label>
            </div>

            <div class="form-group">
                <i class="fas fa-map-marker-alt form-icon"></i>
                <input type="text" id="id_location" name="location" value="{{ property.location }}" placeholder=" ">
                <label for="id_location" class="label-placeholder">Адрес</label>
            </div>

            <div class="form-group">
                <i class="fas fa-ruler-combined form-icon"></i>
                <input type="number" id="id_size" name="size" value="{{ property.size }}" step="0.1" placeholder=" ">
                <label for="id_size" class="label-placeholder">Площадь</label>
            </div>
            <p class="picture">Изображения</p>

            <div class="form-group">
                <div id="imageUploadArea" class="image-upload-area">
                    <input type="file" id="id_images" name="images" accept="image/*" multiple>
                    <div class="upload-placeholder">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>
                <div id="imagePreviewContainer" class="image-preview-container">
                    {% for image in property.images.all %}
                        <div class="image-preview">
                            <img src="{{ image.url }}" alt="Image Preview">
                            <button class="remove-button">&times;</button>
                        </div>
                    {% endfor %}
                </div>
            </div>
            

            <button type="submit" class="btn btn-primary mt-3">Сохранить изменения</button>
        </form>
    </div>

    {% include 'properties/elements/footer.html' %}

    <script>
        document.getElementById('id_images').addEventListener('change', function (event) {
            const container = document.getElementById('imageUploadArea');
            const files = Array.from(event.target.files);
            
            if (container.querySelectorAll('.image-preview').length + files.length > 10) {
                alert('максимум 10 изображений.');
                return;
            }
        
            const formData = new FormData();
        
            files.forEach((file) => {
                const reader = new FileReader();
        
                reader.onload = function (e) {
                    const div = document.createElement('div');
                    div.classList.add('image-preview');
        
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = 'Image Preview';
        
                    const removeButton = document.createElement('button');
                    removeButton.classList.add('remove-button');
                    removeButton.innerHTML = '&times;';
                    removeButton.onclick = function () {
                        div.remove();
                        adjustPlaceholder();
                    };
        
                    div.appendChild(img);
                    div.appendChild(removeButton);
                    container.insertBefore(div, container.querySelector('.upload-placeholder'));
                    adjustPlaceholder();
        
                    formData.append('images', file);
                };
        
                reader.readAsDataURL(file);
            });
        
            const form = document.getElementById('propertyForm');
            form.onsubmit = function (event) {
                event.preventDefault(); 
        
                const imagesField = document.getElementById('id_images');
                files.forEach((file) => {
                    formData.append('images', file);
                });
        
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/property-details/' + data.property_id; // Redirect to updated property details
                    } else {
                        alert('Ошибка при обновлении объявления.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Ошибка при загрузке.');
                });
            };
        });
        
        function adjustPlaceholder() {
            const container = document.getElementById('imageUploadArea');
            const previews = container.querySelectorAll('.image-preview').length;
        
            const placeholder = container.querySelector('.upload-placeholder');
            if (previews >= 10) {
                placeholder.style.display = 'none';
            } else {
                placeholder.style.display = 'flex';
            }
        }
        
    </script>

</body>

</html>
